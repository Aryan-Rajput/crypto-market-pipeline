name: gold-batch-jobs

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-batch:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache Spark package downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.m2
          key: spark-packages-${{ runner.os }}-delta4.3.0-hadoopaws3.4.1
          restore-keys: |
            spark-packages-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run g_volatility
        run: |
          spark-submit --master local[1] \
            --conf spark.driver.memory=1500m \
            --packages io.delta:delta-spark_4.1_2.13:4.3.0,org.apache.hadoop:hadoop-aws:3.4.1 \
            spark/gold/g_volatility.py

      - name: Run g_cross_asset
        run: |
          spark-submit --master local[1] \
            --conf spark.driver.memory=1500m \
            --packages io.delta:delta-spark_4.1_2.13:4.3.0,org.apache.hadoop:hadoop-aws:3.4.1 \
            spark/gold/g_cross_asset.py